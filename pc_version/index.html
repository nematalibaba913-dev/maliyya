<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#07090f;
  --surface:rgba(255,255,255,0.045);
  --border:rgba(255,255,255,0.08);
  --text:#eef0fa;
  --muted:rgba(200,208,240,0.5);
  --dim:rgba(200,208,240,0.25);
  --green:#1fd98a;
  --red:#ff5f5f;
  --blue:#4fa3ff;
  --purple:#8b7fff;
}
/* Light theme */
[data-theme=light]{
  --bg:#f0f4f8;
  --surface:rgba(255,255,255,0.9);
  --border:rgba(0,0,0,0.1);
  --text:#111827;
  --muted:#6b7280;
  --dim:#9ca3af;
  --green:#10b981;
  --red:#ef4444;
  --blue:#3b82f6;
  --purple:#7c3aed;
}
[data-theme=light] html,
[data-theme=light] body{
  background:#f0f4f8;
  color:#111827;
}

html,body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

/* BACKGROUND */
.bg-glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 600px 400px at 20% 15%, rgba(139,127,255,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 500px 350px at 80% 80%, rgba(79,163,255,0.05) 0%, transparent 70%);
}
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 75% 75% at 50% 50%, black 10%, transparent 100%);
}

/* WRAP */
.wrap{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  padding:52px 20px 80px;
  max-width:560px;
  margin:0 auto;
}

/* PROFILE */
.profile-block{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:36px;
  animation:up 0.65s ease both;
}
.avatar-ring{
  width:144px;height:144px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg, rgba(139,127,255,0.6), rgba(79,163,255,0.6));
  margin-bottom:16px;
  box-shadow:0 0 32px rgba(139,127,255,0.2);
}
.avatar-ring img{
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  border:2px solid var(--bg);
}
.profile-name{
  font-size:18px;font-weight:700;
  color:var(--text);letter-spacing:-0.2px;
  margin-bottom:4px;
}
.profile-date{
  font-size:11px;color:var(--dim);font-weight:500;
  letter-spacing:0.4px;
}

/* BALANCE CARD */
.balance-card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px 24px 24px;
  margin-bottom:12px;
  position:relative;overflow:hidden;
  animation:up 0.65s 0.1s ease both;
}
.balance-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(139,127,255,0.5), rgba(79,163,255,0.5), transparent);
}
.balance-label{
  font-size:10px;font-weight:600;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--dim);
  margin-bottom:10px;
}
.balance-amount{
  font-size:38px;font-weight:800;
  letter-spacing:-1.5px;line-height:1;
  margin-bottom:4px;
}
.balance-amount.pos{color:var(--green);}
.balance-amount.neg{color:var(--red);}
.balance-amount.zero{color:var(--text);}
.balance-sign{font-size:24px;font-weight:400;margin-right:2px;opacity:0.7;}
.balance-currency{font-size:22px;font-weight:500;margin-left:3px;opacity:0.6;}

/* STATS ROW */
.stats-row{
  display:flex;gap:10px;
  width:100%;
  margin-bottom:28px;
  animation:up 0.65s 0.15s ease both;
}
.stat-box{
  flex:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 12px;
  text-align:center;
}
.stat-val{
  font-size:15px;font-weight:700;
  margin-bottom:5px;line-height:1;
  letter-spacing:-0.3px;
}
.stat-val.green{color:var(--green);}
.stat-val.red{color:var(--red);}
.stat-lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}

/* SECTION LABEL */
.section-lbl{
  width:100%;
  font-size:10px;font-weight:600;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--dim);
  margin-bottom:10px;padding-left:2px;
  animation:up 0.65s 0.18s ease both;
}

/* CARDS */
.cards{display:flex;flex-direction:column;gap:9px;width:100%;}

.card{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;
  border-radius:14px;
  background:var(--surface);
  border:1px solid var(--border);
  text-decoration:none;color:var(--text);
  transition:background 0.18s,border-color 0.18s,transform 0.18s,box-shadow 0.18s;
}
.card:hover{transform:translateY(-2px);}
.card.p{animation:up 0.6s 0.22s ease both;}
.card.p:hover{border-color:rgba(139,127,255,0.4);background:rgba(139,127,255,0.06);box-shadow:0 6px 24px rgba(139,127,255,0.1);}
.card.b{animation:up 0.6s 0.28s ease both;}
.card.b:hover{border-color:rgba(79,163,255,0.4);background:rgba(79,163,255,0.06);box-shadow:0 6px 24px rgba(79,163,255,0.1);}
.card.g{animation:up 0.6s 0.34s ease both;}
.card.g:hover{border-color:rgba(31,217,138,0.4);background:rgba(31,217,138,0.06);box-shadow:0 6px 24px rgba(31,217,138,0.1);}
.card.a{animation:up 0.6s 0.40s ease both;}
.card.a:hover{border-color:rgba(245,166,35,0.4);background:rgba(245,166,35,0.06);box-shadow:0 6px 24px rgba(245,166,35,0.1);}
.card.t{animation:up 0.6s 0.46s ease both;}
.card.s{animation:up 0.6s 0.52s ease both;}
.card.s:hover{border-color:rgba(139,148,158,0.4);background:rgba(139,148,158,0.06);box-shadow:0 6px 24px rgba(139,148,158,0.1);}
.card.s .card-ico{background:rgba(139,148,158,0.16);border:1px solid rgba(139,148,158,0.2);}
.card.t:hover{border-color:rgba(20,184,166,0.4);background:rgba(20,184,166,0.06);box-shadow:0 6px 24px rgba(20,184,166,0.1);}

.card-ico{
  width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;flex-shrink:0;
  transition:transform 0.18s;
}
.card:hover .card-ico{transform:scale(1.1);}
.card.p .card-ico{background:rgba(139,127,255,0.16);border:1px solid rgba(139,127,255,0.2);}
.card.b .card-ico{background:rgba(79,163,255,0.16);border:1px solid rgba(79,163,255,0.2);}
.card.g .card-ico{background:rgba(31,217,138,0.16);border:1px solid rgba(31,217,138,0.2);}
.card.a .card-ico{background:rgba(245,166,35,0.16);border:1px solid rgba(245,166,35,0.2);}
.card.t .card-ico{background:rgba(20,184,166,0.16);border:1px solid rgba(20,184,166,0.2);}

.card-txt{flex:1;}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;letter-spacing:-0.1px;}
.card-desc{font-size:11px;color:var(--muted);font-weight:400;line-height:1.4;}
.card-arr{font-size:17px;color:var(--dim);transition:transform 0.18s,color 0.18s;flex-shrink:0;}
.card:hover .card-arr{transform:translateX(3px);color:var(--text);}

/* ANIMATIONS */
@keyframes up{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:400px){
  .wrap{padding:36px 14px 60px;}
  .balance-amount{font-size:32px;}
}

.export-btn, .import-btn{
  padding:7px 16px;border-radius:10px;
  font-family:'Montserrat',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.4px;
  cursor:pointer;transition:background .2s,color .2s,border-color .2s;
  text-align:center;
}
.export-btn{
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.05);color:var(--dim);
}
.export-btn:hover{background:rgba(255,255,255,0.1);color:var(--muted);border-color:rgba(255,255,255,0.2);}
.import-btn{
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.05);color:var(--dim);
}
.import-btn:hover{background:rgba(255,255,255,0.1);color:var(--muted);border-color:rgba(255,255,255,0.2);}
[data-theme=light] .export-btn,[data-theme=light] .import-btn{background:rgba(0,0,0,0.04);color:#9ca3af;border-color:rgba(0,0,0,0.1);}
[data-theme=light] .export-btn:hover,[data-theme=light] .import-btn:hover{background:rgba(0,0,0,0.08);color:#6b7280;}

</style>

<script>
(function(){

  // Tarix
  var months = ['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
  var days   = ['Bazar','Bazar ertəsi','Çərşənbə axşamı','Çərşənbə','Cümə axşamı','Cümə','Şənbə'];
  var now    = new Date();
  document.getElementById('today-date').textContent =
    days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  // Formatla
  function fmt(n){
    if(n >= 1000) return (n/1000).toFixed(1).replace('.0','') + 'K';
    return n.toFixed(0);
  }

  async function updateStats(){
    try{
      const toArr = v => {
        if(!v) return [];
        if(Array.isArray(v)) return v;
        try{ const p = JSON.parse(v); return Array.isArray(p) ? p : []; }catch(e){ return []; }
      };
      const fromDB = async (key, useBudget) => {
        if(!window.BudgetDB) return [];
        try{
          const val = useBudget && BudgetDB.getBudget ? await BudgetDB.getBudget(key) : await BudgetDB.getSetting(key);
          return toArr(val);
        }catch(e){ return []; }
      };

      // GəlirXərc log
      let gx = toArr(localStorage.getItem('gelirxerc_cache'));
      const gxDB = await fromDB('gelirxerc_cache', true);
      if(gxDB.length) gx = gxDB;

      // Kredit log
      let crLog = toArr(localStorage.getItem('credit_log_v1'));
      const crDB = await fromDB('credit_log_v1', false);
      if(crDB.length) crLog = crDB;

      // Borc log
      let brLog = toArr(localStorage.getItem('borc_log_v1'));
      const brDB = await fromDB('borc_log_v1', false);
      if(brDB.length) brLog = brDB;

      // Legacy mf_transactions
      const legacy = toArr(localStorage.getItem('mf_transactions'));

      var openBal = parseFloat(localStorage.getItem('mf_opening_bal') || '0') || 0;

      var income = openBal, expense = 0;

      // GəlirXərc log sətirləri
      gx.forEach(function(t){
        var amt = parseFloat(t.Mebleg) || 0;
        var tp = (t.Emeliyyat||'').toLowerCase();
        if(tp.includes('gəlir')||tp.includes('gelir')) income += amt;
        else expense += amt;
      });
      // Kredit log sətirləri
      crLog.forEach(function(t){
        var amt = parseFloat(t.amount||t.Mebleg) || 0;
        var tp = (t.type||t.Emeliyyat||'').toLowerCase();
        if(tp.includes('gəlir')||tp.includes('gelir')) income += amt;
        else expense += amt;
      });
      // Borc log sətirləri
      brLog.forEach(function(t){
        var amt = parseFloat(t.amount||t.Mebleg) || 0;
        var tp = (t.type||t.Emeliyyat||'').toLowerCase();
        if(tp.includes('gəlir')||tp.includes('gelir')) income += amt;
        else expense += amt;
      });
      // Legacy
      legacy.forEach(function(t){
        var amt = parseFloat(t.Mebleg) || 0;
        var tp = (t.Emeliyyat||'').toLowerCase();
        if(tp.includes('gəlir')||tp.includes('gelir')) income += amt;
        else expense += amt;
      });

      var bal = income - expense;
      var balEl  = document.getElementById('bal-main');
      var signEl = document.getElementById('bal-sign');
      var numEl  = document.getElementById('bal-num');
      var total = gx.length + crLog.length + brLog.length + legacy.length;
      if(total === 0 && openBal === 0){
        numEl.textContent = '—'; signEl.textContent = '';
        balEl.className = 'balance-amount zero';
      } else {
        numEl.textContent = fmt(Math.abs(bal));
        signEl.textContent = bal > 0 ? '+' : bal < 0 ? '−' : '';
        balEl.className = 'balance-amount ' + (bal > 0 ? 'pos' : bal < 0 ? 'neg' : 'zero');
      }
    } catch(e){ console.warn('updateStats xəta:', e); }
  }

  document.addEventListener('DOMContentLoaded', function() { updateStats(); });
  window.addEventListener('gist-ready', function() { updateStats(); }, { once: true });
  window.addEventListener('storage', function(e){
    if(e.key === 'mf_transactions') updateStats();
  });
  window.addEventListener('sync-ok', function(e){
    updateStats();
  });

})();
</script>

<script>
// ── Global tema toggle ─────────────────────────────────
const ALL_THEME_KEYS = [
  'page_theme_inputpad','page_theme_dashboard','page_theme_credits',
  'page_theme_forecast','page_theme_transfer','page_theme_index',
  'kredit_theme','mf_theme'
];

function applyIndexTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  document.documentElement.style.background = mode==='light' ? '#f0f4f8' : '#07090f';
  document.documentElement.style.color      = mode==='light' ? '#111827' : '#eef0fa';
  document.body.style.background = mode==='light' ? '#f0f4f8' : '#07090f';
  document.body.style.color      = mode==='light' ? '#111827' : '#eef0fa';

  // Toggle switch animasiyası
  const track = document.getElementById('theme-track');
  const knob  = document.getElementById('theme-knob');
  if(mode === 'light'){
    // Günəş sol tərəfdə
    if(track){ track.style.background='linear-gradient(135deg,#e8edf5,#d4dae8)'; }
    if(knob) { knob.style.left='4px'; knob.style.background='linear-gradient(145deg,#fff,#e8edf2)'; knob.textContent='☀️'; }
  } else {
    // Ay sağ tərəfdə
    if(track){ track.style.background='linear-gradient(135deg,#1a1f2e,#252b3b)'; }
    if(knob) { knob.style.left='42px'; knob.style.background='linear-gradient(145deg,#2d3348,#1e2333)'; knob.textContent='🌙'; }
  }
  ALL_THEME_KEYS.forEach(k => localStorage.setItem(k, mode));
}

function toggleGlobalTheme(){
  const cur = localStorage.getItem('page_theme_index') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  ALL_THEME_KEYS.forEach(k => localStorage.setItem(k, next));
  applyIndexTheme(next);
}

// Init: cari temaya uyğun button göstər
(function(){
  const t = localStorage.getItem('page_theme_index') || 'dark';
  applyIndexTheme(t);
})();

// ── Excel Export (lokal datalar) ───────────────────────
async function readArr(key, preferBudget=false){
  const parseArr = v => {
    if(!v) return [];
    if(Array.isArray(v)) return v;
    try{ const p = JSON.parse(v); return Array.isArray(p) ? p : []; }catch(e){ return []; }
  };
  let arr = parseArr(localStorage.getItem(key));
  if(window.BudgetDB){
    try{
      const val = preferBudget && BudgetDB.getBudget ? await BudgetDB.getBudget(key) : await BudgetDB.getSetting(key);
      const parsed = parseArr(val);
      if(parsed.length) arr = parsed;
    }catch(e){}
  }
  return arr;
}

// ── File System Access API — IndexedDB ilə persist ──────
// Handle-i IndexedDB-də saxlayırıq ki reload-dan sonra da qalsın
const _IDB_NAME = 'mf_fs_handles';
const _IDB_STORE = 'handles';
const _IDB_KEY   = 'export_dir';

function _openHandleDB(){
  return new Promise((res, rej) => {
    const req = indexedDB.open(_IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(_IDB_STORE);
    req.onsuccess = e => res(e.target.result);
    req.onerror   = () => rej(req.error);
  });
}
async function _saveHandle(handle){
  try{
    const db = await _openHandleDB();
    const tx = db.transaction(_IDB_STORE, 'readwrite');
    tx.objectStore(_IDB_STORE).put(handle, _IDB_KEY);
    await new Promise((res,rej) => { tx.oncomplete=res; tx.onerror=rej; });
    db.close();
  } catch(e){}
}
async function _loadHandle(){
  try{
    const db = await _openHandleDB();
    const handle = await new Promise((res,rej) => {
      const req = db.transaction(_IDB_STORE,'readonly').objectStore(_IDB_STORE).get(_IDB_KEY);
      req.onsuccess = () => res(req.result || null);
      req.onerror   = () => rej(req.error);
    });
    db.close();
    return handle || null;
  } catch(e){ return null; }
}
async function _clearHandle(){
  try{
    const db = await _openHandleDB();
    const tx = db.transaction(_IDB_STORE,'readwrite');
    tx.objectStore(_IDB_STORE).delete(_IDB_KEY);
    db.close();
  } catch(e){}
}

async function _ensureDirPermission(handle){
  try{
    const perm = await handle.queryPermission({ mode:'readwrite' });
    if(perm === 'granted') return true;
    const req = await handle.requestPermission({ mode:'readwrite' });
    return req === 'granted';
  } catch(e){ return false; }
}

async function _getDir(){
  if(!window.showDirectoryPicker) return null;

  // IndexedDB-dən saxlanmış handle-i yüklə
  let handle = await _loadHandle();
  if(handle){
    const ok = await _ensureDirPermission(handle);
    if(ok) return handle;
    // İcazə yoxdur — silib yenidən seçdiririk
    await _clearHandle();
  }

  // Yeni qovluq seçimi
  try{
    handle = await window.showDirectoryPicker({ mode:'readwrite', startIn:'documents' });
    await _saveHandle(handle);
    return handle;
  } catch(e){
    return null; // istifadəçi ləğv etdi
  }
}

async function _buildWorkbook(){
  if(typeof XLSX === 'undefined') throw new Error('XLSX kitabxanası yüklənmədi');
  const wb = XLSX.utils.book_new();

  const gx = await readArr('gelirxerc_cache', true);
  XLSX.utils.book_append_sheet(wb,
    XLSX.utils.json_to_sheet(gx.map(r=>({
      'Tarix':r.Tarix||'','Əməliyyat':r.Emeliyyat||'','Kateqoriya':r.Kateqoriya||'','Qeyd':r.Qeyd||'','Məbləğ':r.Mebleg||''
    }))), 'GelirXerc_Log');

  const credits = await readArr('kreditler_v2');
  XLSX.utils.book_append_sheet(wb,
    XLSX.utils.json_to_sheet(credits.map(c=>({
      'id':c.id,'Ad':c.name,'Məbləğ':c.taken,'Aylıq':c.monthly,'Müddət(ay)':c.termMonths,
      'Faiz%':c.rate,'Başlama':c.startDate,'Bitmə':c.endDate,'Toplam Ödəmə':c.totalPayable,
      'Ödəniş sayı':(c.payments||[]).length,'Gizli?':c.hidden?'Bəli':'Xeyr'
    }))), 'Kreditler');

  const creditLog = await readArr('credit_log_v1');
  XLSX.utils.book_append_sheet(wb,
    XLSX.utils.json_to_sheet(creditLog.map(r=>({
      'Tarix':r.date||'','Tip':r.type||'','Qeyd':r.note||'','Məbləğ':r.amount||'','KreditID':r.creditId||''
    }))), 'Kredit_Log');

  const transfers = await readArr('transfers_offline_v1');
  XLSX.utils.book_append_sheet(wb,
    XLSX.utils.json_to_sheet(transfers.map(t=>({
      'id':t.id,'Növ':t.type,'Tarix':t.date,'Məbləğ':t.amount,'Ödənilib':t.paid,'Qeyd':t.note||'','Tamamlanıb?':t.done?'Bəli':'Xeyr','Ödənişlər':(t.payments||[]).length
    }))), 'Borclar');

  const borcLog = await readArr('borc_log_v1');
  XLSX.utils.book_append_sheet(wb,
    XLSX.utils.json_to_sheet(borcLog.map(r=>({
      'Tarix':r.date||'','Tip':r.type||'','Qeyd':r.note||'','Məbləğ':r.amount||''
    }))), 'Borc_Log');

  const legacy = await readArr('mf_transactions');
  XLSX.utils.book_append_sheet(wb,
    XLSX.utils.json_to_sheet(legacy.map(r=>({
      'Tarix':r.Tarix||'','Əməliyyat':r.Emeliyyat||'','Kateqoriya':r.Kateqoriya||'','Qeyd':r.Qeyd||'','Məbləğ':r.Mebleg||'','Mənbə':r.source||'','Status':r.status||''
    }))), 'mf_transactions');

  const budgetItems     = JSON.parse(localStorage.getItem('budgetApp2025')       || '[]');
  const budgetRecurring = JSON.parse(localStorage.getItem('budgetRecurring2025') || '[]');
  const budgetOverrides = JSON.parse(localStorage.getItem('budgetOverrides2025') || '{}');
  const budgetBalances  = JSON.parse(localStorage.getItem('budgetBalances2025')  || '{}');

  if(budgetItems.length){
    XLSX.utils.book_append_sheet(wb,
      XLSX.utils.json_to_sheet(budgetItems.map(r=>({
        'Ay':r.monthYear||'','Növ':r.type||'','Kateqoriya':r.category||'','Qeyd':r.note||'','Məbləğ':r.amount||0,'Tarix':r.date||''
      }))), 'Proqnoz_Qeydler');
  }
  if(budgetRecurring.length){
    XLSX.utils.book_append_sheet(wb,
      XLSX.utils.json_to_sheet(budgetRecurring.map(r=>({
        'ID':r.id||'','Növ':r.type||'','Kateqoriya':r.category||'','Qeyd':r.note||'','Məbləğ':r.amount||0,'Hədəf Aylar':(r.targetMonths||[]).join(', ')
      }))), 'Proqnoz_Tekrarlanan');
  }
  const overrideRows = Object.entries(budgetOverrides).map(([k,v])=>({'Açar':k,'Məbləğ':v}));
  const balanceRows  = Object.entries(budgetBalances).map(([ay,v])=>({'Ay':ay,'Başlanğıc':v.start||'','Son':v.end||''}));
  if(overrideRows.length || balanceRows.length){
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([
      {Sheet:'Overrides'}, ...overrideRows, {}, {Sheet:'Balanslar'}, ...balanceRows
    ]), 'Proqnoz_Diger');
  }

  return wb;
}

async function exportExcel(){
  try{
    const wb    = await _buildWorkbook();
    const fname = 'maliyye_export_' + new Date().toISOString().slice(0,10) + '.xlsx';

    // File System Access API cəhdi
    if(window.showDirectoryPicker){
      const dir = await _getDir();
      if(dir){
        try{
          const fileHandle = await dir.getFileHandle(fname, { create: true });
          const writable   = await fileHandle.createWritable();
          const buf = XLSX.write(wb, { bookType:'xlsx', type:'buffer' });
          await writable.write(buf);
          await writable.close();
          // Düymə üzərindən qısa vizual feedback
          const btn = document.querySelector('.export-btn');
          if(btn){ const old=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=old, 1800); }
          return;
        } catch(e){
          // İcazə ləğv olundu və ya xəta — normal download-a düş
          _clearHandle();
        }
      }
    }

    // Fallback: normal brauzer download
    XLSX.writeFile(wb, fname);
  } catch(e){
    alert('Export xətası: ' + e.message);
  }
}
// ── IMPORT ──────────────────────────────────────────────
async function importExcel(){
  if(typeof XLSX === 'undefined'){ alert('XLSX kitabxanası yüklənmədi'); return; }

  // Xəbərdarlıq
  const warn = confirm(
    '⚠️ XƏBƏRDARLIQ\n\n' +
    'Bu əməliyyat mövcud məlumatların üzərinə yazar.\n\n' +
    'Davam etmək istəyirsiniz?'
  );
  if(!warn) return;

  // Fayl seçimi — hər dəfə
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx';
  input.onchange = function(){
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async function(ev){
    try{
      const buf  = ev.target.result;
      const wb   = XLSX.read(buf, { type:'array' });

      // Toqquşma yoxlaması — mövcud datalar varmı?
      const conflicts = [];
      const checks = [
        ['gelirxerc_cache',     'GəlirXərc Log',       'GelirXerc_Log'],
        ['kreditler_v2',        'Kreditlər',           'Kreditler'],
        ['credit_log_v1',       'Kredit Loqu',         'Kredit_Log'],
        ['transfers_offline_v1','Borclar',             'Borclar'],
        ['borc_log_v1',         'Borc Loqu',           'Borc_Log'],
        ['mf_transactions',     'Köhnə əməliyyatlar',  'mf_transactions'],
      ];
      for(const [lsKey, label, sheetName] of checks){
        const existing = await readArr(lsKey, lsKey==='gelirxerc_cache');
        const inFile   = wb.SheetNames.includes(sheetName)
          ? XLSX.utils.sheet_to_json(wb.Sheets[sheetName])
          : [];
        if(existing.length > 0 && inFile.length > 0){
          conflicts.push(`• ${label}: cari ${existing.length} sətir → faylda ${inFile.length} sətir`);
        }
      }

      if(conflicts.length > 0){
        const ok = confirm(
          '⚠️ TOQQUŞMA AŞKARLANDI\n\n' +
          'Aşağıdakı məlumatlar mövcuddur və üzərinə yazılacaq:\n\n' +
          conflicts.join('\n') +
          '\n\nYenə də davam etmək istəyirsiniz?'
        );
        if(!ok) return;
      }

      // İmport et
      const saveLS = (key, arr) => {
        localStorage.setItem(key, JSON.stringify(arr));
        if(window.BudgetDB) try{ BudgetDB.setSetting(key, arr); }catch(e){}
      };

      for(const [lsKey,, sheetName] of checks){
        if(!wb.SheetNames.includes(sheetName)) continue;
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
        if(!rows.length) continue;

        if(sheetName === 'GelirXerc_Log'){
          saveLS(lsKey, rows.map(r=>({ Tarix:r['Tarix']||'', Emeliyyat:r['Əməliyyat']||'', Kateqoriya:r['Kateqoriya']||'', Qeyd:r['Qeyd']||'', Mebleg:String(r['Məbləğ']||'') })));
        } else if(sheetName === 'Kreditler'){
          saveLS(lsKey, rows.map(r=>({ id:r['id'], name:r['Ad'], taken:r['Məbləğ'], monthly:r['Aylıq'], termMonths:r['Müddət(ay)'], rate:r['Faiz%'], startDate:r['Başlama'], endDate:r['Bitmə'], totalPayable:r['Toplam Ödəmə'], hidden:r['Gizli?']==='Bəli', payments:[] })));
        } else if(sheetName === 'Kredit_Log'){
          saveLS(lsKey, rows.map(r=>({ date:r['Tarix']||'', type:r['Tip']||'', note:r['Qeyd']||'', amount:r['Məbləğ']||0, creditId:r['KreditID']||'' })));
        } else if(sheetName === 'Borclar'){
          saveLS(lsKey, rows.map(r=>({ id:r['id'], type:r['Növ'], date:r['Tarix'], amount:r['Məbləğ'], paid:r['Ödənilib'], note:r['Qeyd']||'', done:r['Tamamlanıb?']==='Bəli', payments:[] })));
        } else if(sheetName === 'Borc_Log'){
          saveLS(lsKey, rows.map(r=>({ date:r['Tarix']||'', type:r['Tip']||'', note:r['Qeyd']||'', amount:r['Məbləğ']||0 })));
        } else if(sheetName === 'mf_transactions'){
          saveLS(lsKey, rows.map(r=>({ Tarix:r['Tarix']||'', Emeliyyat:r['Əməliyyat']||'', Kateqoriya:r['Kateqoriya']||'', Qeyd:r['Qeyd']||'', Mebleg:String(r['Məbləğ']||''), source:r['Mənbə']||'', status:r['Status']||'' })));
        }
      }

      // Proqnoz dataları
      if(wb.SheetNames.includes('Proqnoz_Qeydler')){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Proqnoz_Qeydler']);
        localStorage.setItem('budgetApp2025', JSON.stringify(rows.map(r=>({ monthYear:r['Ay']||'', type:r['Növ']||'', category:r['Kateqoriya']||'', note:r['Qeyd']||'', amount:r['Məbləğ']||0, date:r['Tarix']||'' }))));
      }
      if(wb.SheetNames.includes('Proqnoz_Tekrarlanan')){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Proqnoz_Tekrarlanan']);
        localStorage.setItem('budgetRecurring2025', JSON.stringify(rows.map(r=>({ id:r['ID']||'', type:r['Növ']||'', category:r['Kateqoriya']||'', note:r['Qeyd']||'', amount:r['Məbləğ']||0, targetMonths:(r['Hədəf Aylar']||'').split(', ').filter(Boolean) }))));
      }

      window.dispatchEvent(new CustomEvent('sync-ok', { detail:'import' }));

      const btn = document.querySelector('.import-btn');
      if(btn){ const old=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=old, 1800); }

    } catch(err){
      alert('Import xətası: ' + err.message);
    }
    }; // reader.onload end
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

</script>
