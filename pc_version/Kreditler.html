<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f0f4f8;--surface:#fff;--surface2:#f7f9fb;--border:#e2e8f0;--text:#111827;--muted:#6b7280;--dim:#9ca3af;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b;--purple:#7c3aed;--r:14px;}
[data-theme=dark]{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--dim:#484f58;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--amber:#d29922;--purple:#a371f7;}
body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh;padding-bottom:100px;transition:background .2s,color .2s;}
/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(10px);}
.topbar-title{font-size:16px;font-weight:700;color:var(--text);}
.topbar-date{font-size:11px;color:var(--muted);}
.btn-add-top{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;}
/* CONTENT */
.content{max-width:1400px;margin:0 auto;padding:16px 24px;}
/* SUMMARY CARDS */
.sum-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px;}
@media(max-width:1100px){.sum-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:600px){.sum-grid{grid-template-columns:1fr 1fr;}}
/* Cards responsive */
#cards-active{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
@media(max-width:900px){#cards-active{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){#cards-active{grid-template-columns:1fr;}}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;}
.sum-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sum-card.blue::before{background:linear-gradient(90deg,var(--blue),#6366f1);}
.sum-card.red::before{background:linear-gradient(90deg,var(--red),#f97316);}
.sum-card.green::before{background:linear-gradient(90deg,var(--green),#06b6d4);}
.sum-card.amber::before{background:linear-gradient(90deg,var(--amber),#f97316);}
.sum-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;}
.sum-val{font-size:20px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;margin-bottom:4px;}
.sum-card.blue .sum-val{color:var(--blue);}
.sum-card.red .sum-val{color:var(--red);}
.sum-card.green .sum-val{color:var(--green);}
.sum-card.amber .sum-val{color:var(--amber);}
.sum-sub{font-size:11px;color:var(--muted);}
/* SECTION TABS */
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab-btn{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.tab-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
/* CREDIT CARDS */
.credit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:0;overflow:hidden;transition:border-color .2s,box-shadow .2s;}
.credit-card:hover{border-color:var(--blue);box-shadow:0 4px 20px rgba(0,0,0,.08);}
.credit-card.done-card{opacity:.6;}
.cr-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--border);}
.cr-name{font-size:15px;font-weight:700;}
.cr-bank{font-size:12px;color:var(--muted);margin-top:2px;}
.cr-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
.badge-active{background:rgba(16,185,129,.12);color:var(--green);}
.badge-done{background:rgba(99,102,241,.12);color:var(--purple);}
.badge-new{background:rgba(245,158,11,.12);color:var(--amber);}
.cr-body{padding:14px 16px;}
.cr-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin-bottom:3px;}
.stat-val{font-size:13px;font-weight:700;font-family:'DM Mono',monospace;}
.stat-val.c-blue{color:var(--blue);}.stat-val.c-red{color:var(--red);}.stat-val.c-green{color:var(--green);}.stat-val.c-amber{color:var(--amber);}
/* PROGRESS */
.prog-wrap{margin-bottom:14px;}
.prog-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;}
.prog-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .6s;}
/* PAYMENT ROW */
.pay-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);}
.next-pay{font-size:12px;color:var(--muted);}
.next-pay strong{color:var(--text);}
.pay-amt{font-size:15px;font-weight:700;color:var(--amber);font-family:'DM Mono',monospace;}
.btn-pay{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--green);border-radius:9px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-pay:hover{background:var(--green);color:#fff;}
.btn-pay:disabled{opacity:.35;cursor:not-allowed;}
/* ACTION BUTTONS */
.cr-actions{padding:8px 16px;display:flex;gap:8px;border-top:1px solid var(--border);background:var(--surface2);}
.btn-xs{font-size:11px;font-weight:600;border-radius:7px;padding:5px 10px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s;}
.btn-xs:hover{color:var(--text);border-color:var(--text);}
.btn-xs.danger:hover{color:var(--red);border-color:var(--red);}
/* HISTORY */
.hist-section{border-top:1px solid var(--border);max-height:0;overflow:hidden;transition:max-height .35s ease;}
.hist-section.open{max-height:400px;}
.hist-inner{padding:12px 16px;}
.hist-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;}
.hist-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;}
.hist-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--surface2);border-radius:8px;font-size:12px;}
.hist-date{color:var(--muted);font-family:'DM Mono',monospace;}
.hist-amt{font-weight:700;color:var(--green);font-family:'DM Mono',monospace;}
.hist-excl{font-size:10px;color:var(--amber);margin-left:4px;}
.hist-del{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:0 4px;}
.hist-del:hover{color:var(--red);}
.btn-hist{width:100%;border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:8px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:4px;transition:color .15s;}
.btn-hist:hover{color:var(--blue);}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;}
.modal-ov.show{display:flex;}
.modal{background:var(--surface);border-radius:18px;padding:24px;width:420px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.4);}
.modal h3{font-size:16px;font-weight:700;margin-bottom:18px;}
.frow{margin-bottom:12px;}
.flbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px;display:block;}
.finp{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;}
.finp:focus{border-color:var(--blue);}
.excl-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:9px;margin-bottom:12px;cursor:pointer;}
.excl-row input{width:17px;height:17px;accent-color:var(--amber);cursor:pointer;}
.excl-lbl{font-size:12px;color:var(--amber);font-weight:600;}
.excl-desc{font-size:11px;color:var(--muted);font-weight:400;}
.modal-btns{display:flex;gap:10px;margin-top:16px;}
.btn-cancel{flex:1;background:var(--surface2);color:var(--muted);border:1.5px solid var(--border);border-radius:9px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-ok{flex:2;background:var(--blue);color:#fff;border:none;border-radius:9px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-ok:hover{opacity:.88;}
/* CHART */
.chart-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.chart-title{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text);}
.chart-wrap{position:relative;height:220px;}
/* TOAST */
.toast{position:fixed;bottom:24px;right:20px;z-index:999;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.2);transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-left:3px solid var(--green);}
.toast.err{border-left:3px solid var(--red);}
/* HOME BUTTON */
.home-fab{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:10px;background:rgba(30,34,50,0.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;z-index:9000;text-decoration:none;transition:background .18s,transform .15s;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.home-fab:active{transform:scale(.92);}
.home-fab:hover{background:rgba(50,56,80,0.95);}
.home-fab span{display:block;width:20px;height:2px;background:#e8eaf6;border-radius:2px;}
@media(max-width:600px){.cr-stats{grid-template-columns:1fr 1fr;}}
</style>

<script>
// "?"? DATA "?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?
const DEFAULT_CREDITS = [];

let credits = [];
let creditLog = [];
let payTarget = null;
let editTarget = null;
let curTab = 'active';
const CHARTS = {};

// ?? STATE - lokal/IndexedDB
const STORAGE_KEY = "credits_idb_v1";
const LOG_KEY     = "credit_log_v1";
let _creditsSaving = false;

function loadState(){
  try{ const parsed=JSON.parse(localStorage.getItem("kreditler_v2")||"[]"); if(Array.isArray(parsed)) credits=parsed; }catch(e){}
  try{ const log=JSON.parse(localStorage.getItem(LOG_KEY)||"[]"); if(Array.isArray(log)) creditLog=log; }catch(e){}

  if(window.BudgetDB){
    BudgetDB.openDB()
      .then(()=>Promise.all([
        BudgetDB.getSetting(STORAGE_KEY),
        BudgetDB.getSetting(LOG_KEY)
      ]))
      .then(([cr,lg])=>{
        if(Array.isArray(cr)) credits=cr;
        if(Array.isArray(lg)) creditLog=lg;
        renderAll();
      })
      .catch(console.error);
  }

  renderAll();
}

function saveState(){
  localStorage.setItem("kreditler_v2", JSON.stringify(credits));
  localStorage.setItem(LOG_KEY, JSON.stringify(creditLog));
  if(window.BudgetDB){
    try{
      BudgetDB.setSetting(STORAGE_KEY, credits);
      BudgetDB.setSetting(LOG_KEY, creditLog);
    }catch(e){ console.error(e); }
  }
}// "?"? CALC "?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?
function calc(cr){
  // Faktiki ödənilmiş (bütün payments, excludeCalc daxil ⇄ kreditin öz qalıq hesabı üçün)
  const paidAmt = (cr.payments||[]).reduce((s,p)=>s+(p.amount||0), 0);
  const remainAmt = Math.max(0, cr.totalPayable - paidAmt);
  const paidMonths = (cr.payments||[]).length;
  const remainMonths = Math.max(0, cr.termMonths - paidMonths);
  const pct = cr.totalPayable > 0 ? Math.min(100, (paidAmt/cr.totalPayable)*100) : 0;
  const isDone = remainAmt < 0.01;
  const isNew  = paidMonths === 0;
  // Növbəti ödəniş tarixi
  const start = new Date(cr.startDate);
  const next = new Date(start);
  next.setMonth(next.getMonth() + paidMonths + 1);
  // Bu günT qalıq: kredit balansı (sadT formula)
  const todayBalance = remainAmt > 0 ? remainAmt : 0;
  return { paidAmt, remainAmt, paidMonths, remainMonths, pct, isDone, isNew, nextPayDate: next };
}

function fmt(n){ return new Intl.NumberFormat('az-AZ',{minimumFractionDigits:0,maximumFractionDigits:0}).format(n)+' ₼'; }
function fmtDate(d){
  if(!d || isNaN(d)) return '—';
  const months = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avqust','sentyabr','oktyabr','noyabr','dekabr'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}
function fmtDateInput(d){ return d.toISOString().split('T')[0]; }

// "?"? RENDER "?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?
function renderAll(){
  renderSummary();
  renderCards();
  renderLog();
  if(curTab === 'charts') renderCharts();
}

function renderSummary(){
  const active = credits.filter(cr=>!cr.hidden);
  let totalTaken=0, totalRemain=0, totalPaid=0, totalPayable=0;
  let totalMonthly=0, todayBalance=0;
  let lastPayDates = [];
  const today = new Date();
  active.forEach(cr=>{
    const cv = calc(cr);
    totalTaken    += cr.taken;
    totalRemain   += cv.remainAmt;
    totalPaid     += cv.paidAmt;
    totalPayable  += cr.totalPayable;
    // Aylıq ödənişlər cəmi — yalnız aktiv (bitməmiş) kreditlər
    if(!cv.isDone) totalMonthly += (cr.monthly||0);
    // Bu günə olan borc qalığı — bu günə qədər ödənilməli olan məbləğ
    if(!cv.isDone){
      const start = new Date(cr.startDate);
      // Bu günə qədər neçə ay keçib
      const monthsPassed = (today.getFullYear()-start.getFullYear())*12 + (today.getMonth()-start.getMonth());
      const expectedPaid = Math.min(monthsPassed, cr.termMonths) * cr.monthly;
      const actualPaid   = cv.paidAmt;
      // Bu günə borc qalığı = ümumi öhdəlik - bu günə qədər ödənilmiş olmalı idisə
      const todayDebt = Math.max(0, cr.totalPayable - expectedPaid);
      todayBalance += todayDebt;
    }
    if(cr.endDate) lastPayDates.push(cr.endDate);
  });
  lastPayDates.sort();
  const lastEnd = lastPayDates.length ? lastPayDates[lastPayDates.length-1] : null;
  const lastEndFmt = lastEnd ? (()=>{ const d=new Date(lastEnd); return d.getDate()+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getFullYear(); })() : '—';

  document.getElementById('s-taken').textContent       = fmt(totalTaken);
  document.getElementById('s-taken-sub').textContent   = active.length + ' kredit';
  document.getElementById('s-total').textContent       = fmt(totalPayable);
  document.getElementById('s-total-sub').textContent   = 'ümumi ödəniləcək';
  document.getElementById('s-remain').textContent      = fmt(totalRemain);
  document.getElementById('s-remain-sub').textContent  = lastEndFmt;
  document.getElementById('s-paid').textContent        = fmt(totalPaid);
  document.getElementById('s-paid-sub').textContent    = active.filter(cr=>!calc(cr).isDone).length + ' aktiv';
  document.getElementById('s-monthly').textContent     = fmt(totalMonthly);
  document.getElementById('s-monthly-sub').textContent = active.filter(cr=>!calc(cr).isDone).length + ' aktiv kredit';
  document.getElementById('s-today').textContent       = fmt(todayBalance);
  document.getElementById('s-today-sub').textContent   = 'bu günə qalıq';
}

function buildCard(cr){
  const c = calc(cr);
  const badgeCls = c.isDone ? 'badge-done' : c.isNew ? 'badge-new' : 'badge-active';
  const badgeTxt = c.isDone ? 'Tamamlandı' : c.isNew ? 'Yeni' : 'Aktiv';
  const pColor = c.pct > 75 ? '#10b981' : c.pct > 40 ? '#f59e0b' : cr.color;
  const histHtml = (cr.payments||[]).length
    ? [...cr.payments].reverse().map((p,ri)=>{
        const realIdx = (cr.payments.length-1-ri);
        return `<div class="hist-item">
          <span class="hist-date">${p.date}</span>
          <span class="hist-amt">${fmt(p.amount)}</span>
          <button class="hist-del" onclick="deletePayment('${cr.id}',${realIdx})">-</button>
        </div>`;
      }).join('')
    : '<div style="color:var(--dim);font-size:12px;text-align:center;padding:8px;">Ödəniş yoxdur</div>';

  return `<div class="credit-card${c.isDone?' done-card':''}" id="card-${cr.id}">
    <div class="cr-head" style="background:${cr.color}18;border-bottom:2px solid ${cr.color}40;">
      <div>
        <div class="cr-name" style="color:${cr.color};">${cr.name}</div>
        <div class="cr-bank">${cr.bank||cr.name} · ${cr.rate}% · ${cr.termMonths} ay</div>
      </div>
      <span class="cr-badge ${badgeCls}" style="background:${cr.color}22;color:${cr.color};">${badgeTxt}</span>
    </div>
    <div class="cr-body">
      <div class="cr-stats">
        <div><div class="stat-lbl">Alınan</div><div class="stat-val c-blue">${fmt(cr.taken)}</div></div>
        <div><div class="stat-lbl">Ümumi borc</div><div class="stat-val">${fmt(cr.totalPayable)}</div></div>
        <div><div class="stat-lbl">Qalıq Məbləğ</div><div class="stat-val c-red">${fmt(c.remainAmt)}</div></div>
        <div><div class="stat-lbl">Ödənilmiş</div><div class="stat-val c-green">${fmt(c.paidAmt)}</div></div>
        <div><div class="stat-lbl">Qalıq ay</div><div class="stat-val">${c.remainMonths} ay</div></div>
        <div><div class="stat-lbl">Ödənilmiş ay</div><div class="stat-val">${c.paidMonths} ay</div></div>
      </div>
      <div class="prog-wrap">
        <div class="prog-head"><span>${c.paidMonths}/${cr.termMonths} ay</span><span style="font-weight:700;color:${pColor}">${Math.round(c.pct)}%</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${c.pct}%;background:linear-gradient(90deg,${pColor},${pColor}aa)"></div></div>
      </div>
    </div>
    <div class="pay-row">
      <div>
        <div class="next-pay">Növbəti: <strong>${fmtDate(c.nextPayDate)}</strong></div>
        <div class="next-pay" style="margin-top:2px;">Bitmə: <strong>${cr.endDate}</strong></div>
      </div>
      <span class="pay-amt">${fmt(cr.monthly)}</span>
      <button class="btn-pay" onclick="openPayModal('${cr.id}')" ${c.isDone?'disabled':''}>✓ Ödəniş</button>
    </div>
    <div class="cr-actions">
      <button class="btn-xs" onclick="toggleHist('${cr.id}')"> Ödənişlər (${(cr.payments||[]).length})</button>
      <button class="btn-xs" onclick="openEditModal('${cr.id}')">Redaktə</button>
      <button class="btn-xs danger" onclick="deleteCredit('${cr.id}')">Sil</button>
    </div>
    <div class="hist-section" id="hist-${cr.id}">
      <div class="hist-inner">
        <div class="hist-title">Ödəniş Tarixi</div>
        <div class="hist-list">${histHtml}</div>
      </div>
    </div>
    <button class="btn-hist" onclick="toggleHist('${cr.id}')"><span id="ha-${cr.id}">▾</span> Ödəniş tarixi</button>
  </div>`;
}

function openPayModal(id){
  const cr = credits.find(c=>c.id===id);

  payTarget = id;
  const c = calc(cr);

function confirmPay(){
  if(!payTarget) return;
  const cr = credits.find(c=>c.id===payTarget);
  if(!cr) return;
  const date   = document.getElementById('pay-date').value;
  const amount = parseFloat(document.getElementById('pay-amount').value)||0;

  if(!amount||amount<=0){ toast('Məbləğ daxil edin','err'); return; }
  if(!date){ toast('Tarix seçin','err'); return; }

  const payment = { date, amount };
  cr.payments = cr.payments || [];
  cr.payments.push(payment);
  cr.payments.sort((a,b)=>a.date.localeCompare(b.date));

  addLog({ id:'log_'+Date.now(), date, type:'Xərc', note: cr.name + ' - ayliq ödəniş', amount, creditId: cr.id });

  saveState();

  const c = calc(cr);
  renderAll();
  closePayModal();
  toast(c.isDone ? cr.name+' Tamamlandı! ✓' : 'Ödəniş qeyd edildi ✓', 'ok');
}

function deletePayment(creditId, idx){
  const cr = credits.find(c=>c.id===creditId);
  if(!cr||!confirm('Bu ödənişi silmək istəyirsiniz?')) return;
  cr.payments.splice(idx,1);
  saveState();
  renderAll();

function openAddModal(){
  document.getElementById('a-name').value='';

  document.getElementById('a-term').value='36';

function saveNewCredit(){
  const name   = document.getElementById("a-name").value.trim();
  const amount = parseFloat(document.getElementById("a-amount").value)||0;
  const monthly= parseFloat(document.getElementById("a-monthly").value)||0;
  const term   = parseInt(document.getElementById("a-term").value)||36;
  const rate   = parseFloat(document.getElementById("a-rate").value)||0;
  const start  = document.getElementById("a-start").value;
  if(!name||!amount||!monthly||!start){ toast("Bütün sahələri doldurun","err"); return; }
  const paidN  = Math.max(0, parseInt(document.getElementById("a-paid").value)||0);
  if(paidN > term){ toast("Ödənilmiş ay müddətdən çox ola bilməz","err"); return; }
  const endD = new Date(start); endD.setMonth(endD.getMonth()+term);
  const cr = {
    id: "cr_"+Date.now(),
    name, bank: name,
    taken: amount,
    totalPayable: monthly * term,
    monthly, termMonths: term, rate,
    startDate: start, endDate: fmtDateInput(endD),
    color: ['#3b82f6','#10b981','#f59e0b','#7c3aed','#ef4444'][credits.length%5],
    payments: []
  };
  // Əvvəlki ödənilmiş aylar: hər biri aylıq məbləğlə, başlama tarixindən hər ay (loga yazılmır)
  for(let i=1;i<=paidN;i++){
    const sd = new Date(start);
    const pd = new Date(Date.UTC(sd.getUTCFullYear(), sd.getUTCMonth()+i, 1));
    pd.setUTCDate(Math.min(sd.getUTCDate(), new Date(Date.UTC(pd.getUTCFullYear(), pd.getUTCMonth()+1, 0)).getUTCDate()));
    cr.payments.push({ date: fmtDateInput(pd), amount: monthly });
  }
  credits.unshift(cr);
  saveState();
  addLog({ id:'log_'+Date.now(), date:start, type:'Gəlir', note: name+' - kredit alındı', amount, creditId: cr.id });
  renderAll();
  closeAddModal();
  toast(name+' əlavə edildi ✓','ok');
}function openEditModal(id){
  const cr = credits.find(c=>c.id===id);
  if(!cr) return;
  editTarget = id;
  document.getElementById('e-name').value   = cr.name;
  document.getElementById('e-amount').value = cr.taken;
  document.getElementById('e-monthly').value= cr.monthly;
  document.getElementById('e-term').value   = cr.termMonths;

function closeEditModal(){ document.getElementById('edit-modal').classList.remove('show'); editTarget=null; }

function saveEdit(){
  const cr = credits.find(c=>c.id===editTarget);
  if(!cr) return;
  cr.name    = document.getElementById('e-name').value.trim()||cr.name;
  cr.bank    = cr.name;
  cr.taken   = parseFloat(document.getElementById('e-amount').value)||cr.taken;
  cr.monthly = parseFloat(document.getElementById('e-monthly').value)||cr.monthly;
  cr.termMonths = parseInt(document.getElementById('e-term').value)||cr.termMonths;
  cr.rate    = parseFloat(document.getElementById('e-rate').value)||cr.rate;
  cr.startDate = document.getElementById('e-start').value||cr.startDate;
  cr.totalPayable = cr.monthly * cr.termMonths;
  const end = new Date(cr.startDate); end.setMonth(end.getMonth()+cr.termMonths);
  cr.endDate = fmtDateInput(end);
  saveState(); closeEditModal(); renderAll();
  toast('Kredit yeniləndi ✓','ok');
}

// "?"? CHARTS "?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?"?
function renderCharts(){
  const active = credits.filter(cr=>!cr.hidden);
  if(!active.length) return;

  // 1. Aylıq ödəniş yükü
  const labels = active.map(cr=>cr.name);
  const monthlyData = active.map(cr=>cr.monthly);
  const colors = active.map(cr=>cr.color||'#3b82f6');

  destroyChart('ch-monthly');
  CHARTS['ch-monthly'] = new Chart(document.getElementById('ch-monthly'),{
    type:'bar',
    data:{labels,datasets:[{label:'Aylıq (₼)',data:monthlyData,backgroundColor:colors.map(c=>c+'99'),borderColor:colors,borderWidth:1.5,borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'var(--muted)'},grid:{display:false}},y:{ticks:{color:'var(--muted)'},grid:{color:'rgba(128,128,128,.1)'}}}}
  });

  // 2. Borc azalması
  destroyChart('ch-progress');
  const progressDatasets = active.map(cr=>{
    const points = [];
    let remaining = cr.totalPayable;
    points.push(remaining);
    const sorted = [...(cr.payments||[])].sort((a,b)=>a.date.localeCompare(b.date));
    sorted.forEach(p=>{ remaining=Math.max(0,remaining-p.amount); points.push(remaining); });
    // Fill to term length
    while(points.length <= cr.termMonths) points.push(remaining);
    return {label:cr.name, data:points.slice(0,cr.termMonths+1), borderColor:cr.color, backgroundColor:'transparent', borderWidth:2, tension:.4, pointRadius:0};
  });
  const maxMonths = Math.max(...active.map(cr=>cr.termMonths));
  const progLabels = Array.from({length:maxMonths+1},(_,i)=>i===0?'Başlanğıc':i+'. ay');
  CHARTS['ch-progress'] = new Chart(document.getElementById('ch-progress'),{
    type:'line',
    data:{labels:progLabels,datasets:progressDatasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'var(--muted)',font:{size:11}}}},scales:{x:{ticks:{color:'var(--muted)',maxTicksLimit:12},grid:{display:false}},y:{ticks:{color:'var(--muted)',callback:v=>Math.round(v)+'₼'},grid:{color:'rgba(128,128,128,.1)'}}}}
  });

  // 3. Pie chart: ödənilmiş vs qalıq ⇄ xarici etiketlər + faizlTr
  destroyChart('ch-donut');
  let totalPaid=0, totalRemain=0;
  active.forEach(cr=>{ const cv=calc(cr); totalPaid+=cv.paidAmt; totalRemain+=cv.remainAmt; });
  const totalAll = totalPaid + totalRemain;
  const paidPct  = totalAll > 0 ? Math.round((totalPaid/totalAll)*100) : 0;
  const remainPct= 100 - paidPct;

  // External label plugin
  const pieLabelsPlugin = {
    id: 'pieLabels',
    afterDatasetsDraw(chart){
      const {ctx, data, chartArea:{left,right,top,bottom,width,height}} = chart;
      const cx = left + width/2, cy = top + height/2;
      const meta = chart.getDatasetMeta(0);
      ctx.save();
      meta.data.forEach((arc, i)=>{
        const angle = (arc.startAngle + arc.endAngle) / 2;
        const r = arc.outerRadius;
        // Label line endpoint
        const lx = cx + Math.cos(angle) * (r + 18);
        const ly = cy + Math.sin(angle) * (r + 18);
        // Text endpoint
        const tx = cx + Math.cos(angle) * (r + 32);
        const ty = cy + Math.sin(angle) * (r + 32);
        // Line
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r);
        ctx.lineTo(lx, ly);
        ctx.lineTo(tx, ty);
        ctx.strokeStyle = i===0 ? '#10b981' : '#ef4444';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Text
        const pct = i===0 ? paidPct : remainPct;
        const lbl = (i===0 ? 'Ödənilmiş' : 'Qalıq') + ' ' + pct + '%';
        ctx.fillStyle = i===0 ? '#10b981' : '#ef4444';
        ctx.font = 'bold 11px Inter,sans-serif';
        ctx.textAlign = Math.cos(angle) > 0 ? 'left' : 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(lbl, tx + (Math.cos(angle)>0?4:-4), ty);
      });
      ctx.restore();
    }
  };

  CHARTS['ch-donut'] = new Chart(document.getElementById('ch-donut'),{
    type:'pie',
    data:{
      labels:['Ödənilmiş ('+paidPct+'%)','Qalıq ('+remainPct+'%)'],
      datasets:[{
        data:[totalPaid, totalRemain],
        backgroundColor:['rgba(16,185,129,.75)','rgba(239,68,68,.75)'],
        borderColor:['#10b981','#ef4444'],
        borderWidth:2,
        hoverOffset:6
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      layout:{ padding:{left:50,right:50,top:20,bottom:20} },
      plugins:{
        legend:{ display:false },
        tooltip:{ callbacks:{ label: ctx => ctx.label + ': ' + Math.round(ctx.parsed) + ' ₼' }}
      }
    },
    plugins:[pieLabelsPlugin]
  });
}

function destroyChart(id){
  if(CHARTS[id]){ try{CHARTS[id].destroy();}catch(e){} delete CHARTS[id]; }
}

function addLog(entry){
  creditLog = creditLog || [];
  creditLog.push(entry);
  saveState();
  renderLog();
}
function editLog(idx, updated){
  if(creditLog[idx]){ creditLog[idx] = {...creditLog[idx], ...updated}; saveState(); renderLog(); }
}
function deleteLog(idx){
  if(!confirm('Bu qeydi silmək istəyirsiniz?')) return;
  creditLog.splice(idx,1); saveState(); renderLog();
}
function renderLog(){
  const tbody = document.getElementById("log-body");
  if(!tbody) return;
  const rows = (creditLog||[]).map((r,idx)=>({r,idx})).sort((a,b)=> (b.r.date||'').localeCompare(a.r.date||''));
  const cntEl = document.getElementById("log-count");
  if(cntEl) cntEl.textContent = `(${rows.length} sətr)`;
  if(!rows.length){ tbody.innerHTML='<tr><td colspan="5" style="padding:8px;color:var(--muted);">Log boşdur</td></tr>'; return; }
  tbody.innerHTML = rows.map(({r,idx})=>{
    const isIncome = (r.type||'').toLowerCase().startsWith('g');
    const badgeColor = isIncome ? 'var(--green)' : 'var(--red)';
    return `<tr>
      <td style="padding:8px;">${fmtDate(new Date(r.date))}</td>
      <td style="padding:8px;"><span style="display:inline-block;padding:4px 8px;border-radius:10px;background:${badgeColor}20;color:${badgeColor};font-weight:700;font-size:11px;">${r.type||''}</span></td>
      <td style="padding:8px;">${r.note||''}</td>
      <td style="padding:8px;">${fmt(r.amount||0)}</td>
      <td style="padding:8px;white-space:nowrap;">
        <button class="btn-xs" onclick="promptEditLog(${idx})">Edit</button>
        <button class="btn-xs danger" onclick="deleteLog(${idx})">Sil</button>
      </td>
    </tr>`;
  }).join('');
}
function promptEditLog(idx){
  const r = creditLog[idx]; if(!r) return;
  const amt = prompt('Məbləğ', r.amount); if(amt===null) return;
  const note = prompt('Qeyd', r.note||''); if(note===null) return;
  const date = prompt('Tarix (YYYY-MM-DD)', r.date||''); if(date===null) return;
  const type = prompt('Tip (Gəlir/Xərc)', r.type||''); if(type===null) return;
  editLog(idx,{amount:parseFloat(amt)||0,type,note,date});
}
